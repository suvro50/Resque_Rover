; ============================================================================
; GridZero — ESP32-CAM Firmware (PlatformIO Configuration)
; ============================================================================
; Target: AI-Thinker ESP32-CAM Module (OV2640)
; Purpose: MJPEG live video streaming for rescue dashboard
; ============================================================================

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CAMERA_MODEL_AI_THINKER

; Upload settings (via FTDI programmer)
upload_speed = 115200

; Monitor
monitor_filters = esp32_exception_decoder
