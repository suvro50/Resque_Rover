; ============================================================================
; GridZero — ESP32 Main Firmware (PlatformIO Configuration)
; ============================================================================
; Target: ESP32 Dev Board (38-pin)
; Sensors: MLX90614, MQ-9, HC-SR04 x2
; Motors: L298N H-Bridge
; Communication: Wi-Fi HTTP + JSON
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D GRIDZERO_VERSION=\"1.0.0\"

; Libraries
lib_deps = 
    ; adafruit/Adafruit MLX90614 Library@^2.1.5 (Disabled until sensor is connected)
    bblanchon/ArduinoJson@^7.0.0
    ; WiFi and HTTP are built into ESP32 Arduino core

; Upload settings
upload_speed = 921600

; Monitor filters
monitor_filters = esp32_exception_decoder
