; ============================================================================
; GridZero — Motor Test Firmware (L298N + ESP32)
; ============================================================================
; Purpose: Test 4x TT motors via phone WiFi control
; No sensors, no server — just motors!
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
